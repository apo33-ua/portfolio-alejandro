<header class="fixed top-0 left-0 z-50 w-full">
  <nav
    class="border-b border-slate-200/70 bg-white/90 backdrop-blur-xl
           dark:border-slate-800/70 dark:bg-slate-950/90"
  >
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

      <div class="flex h-[72px] items-center justify-between">

        <!-- Logo -->

        <a
          href="#inicio"
          (click)="closeMobileMenu()"
          class="group flex items-center gap-3"
        >
          <img
            src="/assets/ap-logo.png"
            alt="AP - Alejandro Palomares Orugo"
            class="h-10 w-10 rounded-xl object-cover
                  transition-transform duration-300
                  group-hover:scale-105"
          />

          <span
            class="text-[21px] font-extrabold tracking-tight
                  text-slate-900 dark:text-white"
          >
            Alejandro<span class="text-blue-600">.</span>
          </span>
        </a>

        <!-- Desktop -->
        <div class="hidden md:flex items-center gap-2">

          <a
            href="#inicio"
            class="rounded-lg px-4 py-2.5 text-sm font-semibold
                   text-slate-700 hover:bg-slate-100
                   dark:text-slate-300 dark:hover:bg-slate-800"
          >
            Inicio
          </a>

          <a
            href="#proyectos"
            class="rounded-lg px-4 py-2.5 text-sm font-semibold
                   text-slate-700 hover:bg-slate-100
                   dark:text-slate-300 dark:hover:bg-slate-800"
          >
            Proyectos
          </a>

          <a
            href="#experiencia"
            class="rounded-lg px-4 py-2.5 text-sm font-semibold
                   text-slate-700 hover:bg-slate-100
                   dark:text-slate-300 dark:hover:bg-slate-800"
          >
            Experiencia
          </a>

          <a
            href="#educacion"
            class="rounded-lg px-4 py-2.5 text-sm font-semibold
                   text-slate-700 hover:bg-slate-100
                   dark:text-slate-300 dark:hover:bg-slate-800"
          >
            Educación
          </a>

          <!-- Tema -->
          <button
            type="button"
            (click)="preferences.toggleTheme()"
            class="ml-2 flex h-10 w-10 items-center justify-center rounded-xl
                   border border-slate-200 bg-white text-slate-600
                   dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
          >
            @if (preferences.theme() === 'light') {
              🌙
            } @else {
              ☀️
            }
          </button>

          <!-- Idioma -->
          <button
            type="button"
            (click)="preferences.toggleLanguage()"
            class="flex h-10 min-w-[52px] items-center justify-center
                   rounded-xl border border-slate-200 bg-white px-3
                   text-xs font-bold text-slate-600
                   dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300"
          >
            {{ preferences.language() === 'es' ? 'EN' : 'ES' }}
          </button>

          <!-- Contacto -->
          <a
            href="#contacto"
            class="ml-2 rounded-xl bg-slate-950 px-5 py-2.5
                   text-sm font-semibold text-white
                   hover:bg-blue-600
                   dark:bg-blue-600 dark:hover:bg-blue-500"
          >
            Hablemos
          </a>
        </div>

        <!-- Mobile controls -->
        <div class="flex items-center gap-2 md:hidden">

          <!-- Tema -->
          <button
            type="button"
            (click)="preferences.toggleTheme()"
            class="flex h-10 w-10 items-center justify-center rounded-xl
                   border border-slate-200 bg-white
                   dark:border-slate-700 dark:bg-slate-900"
          >
            @if (preferences.theme() === 'light') {
              🌙
            } @else {
              ☀️
            }
          </button>

          <!-- Idioma -->
          <button
            type="button"
            (click)="preferences.toggleLanguage()"
            class="flex h-10 min-w-[46px] items-center justify-center
                   rounded-xl border border-slate-200 bg-white
                   text-xs font-bold
                   dark:border-slate-700 dark:bg-slate-900"
          >
            {{ preferences.language() === 'es' ? 'EN' : 'ES' }}
          </button>

          <!-- Hamburguesa -->
          <button
            type="button"
            (click)="toggleMobileMenu()"
            class="flex h-10 w-10 items-center justify-center rounded-xl
                   border border-slate-200 bg-white text-slate-700
                   dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200"
            aria-label="Abrir menú"
          >
            @if (!mobileMenuOpen()) {
              ☰
            } @else {
              ✕
            }
          </button>

        </div>

      </div>

      <!-- Menú móvil -->
      @if (mobileMenuOpen()) {
        <div
          class="border-t border-slate-200 py-4 dark:border-slate-800 md:hidden"
        >

          <div class="flex flex-col gap-1">

            <a
              href="#inicio"
              (click)="closeMobileMenu()"
              class="rounded-xl px-4 py-3 text-sm font-semibold
                     text-slate-700 hover:bg-slate-100
                     dark:text-slate-300 dark:hover:bg-slate-800"
            >
              Inicio
            </a>

            <a
              href="#proyectos"
              (click)="closeMobileMenu()"
              class="rounded-xl px-4 py-3 text-sm font-semibold
                     text-slate-700 hover:bg-slate-100
                     dark:text-slate-300 dark:hover:bg-slate-800"
            >
              Proyectos
            </a>

            <a
              href="#experiencia"
              (click)="closeMobileMenu()"
              class="rounded-xl px-4 py-3 text-sm font-semibold
                     text-slate-700 hover:bg-slate-100
                     dark:text-slate-300 dark:hover:bg-slate-800"
            >
              Experiencia
            </a>

            <a
              href="#habilidades"
              (click)="closeMobileMenu()"
              class="rounded-xl px-4 py-3 text-sm font-semibold
                     text-slate-700 hover:bg-slate-100
                     dark:text-slate-300 dark:hover:bg-slate-800"
            >
              Habilidades
            </a>

            <a
              href="#educacion"
              (click)="closeMobileMenu()"
              class="rounded-xl px-4 py-3 text-sm font-semibold
                     text-slate-700 hover:bg-slate-100
                     dark:text-slate-300 dark:hover:bg-slate-800"
            >
              Educación
            </a>

            <a
              href="#contacto"
              (click)="closeMobileMenu()"
              class="mt-2 rounded-xl bg-slate-950 px-4 py-3 text-center
                     text-sm font-semibold text-white
                     dark:bg-blue-600"
            >
              Hablemos
            </a>

          </div>
        </div>
      }

    </div>
  </nav>
</header>

<!-- Contenedor principal -->
<main class="pt-[72px] min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
  <app-hero></app-hero>
  <app-projects></app-projects>
  <app-experience></app-experience>
  <app-skills></app-skills>
  <app-education></app-education>
</main>

<app-footer></app-footer>
